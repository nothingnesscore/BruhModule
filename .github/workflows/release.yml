name: Build and Release Beta
on:
  push:
    branches: [ main ]
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build Binary
        run: |
          export RUST_BACKTRACE=1
          export RUST_LOG=debug
          cross build --target aarch64-linux-android --release --verbose 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit 1; fi
      - name: Package Module
        run: |
          mkdir -p module/system/bin
          cp target/aarch64-linux-android/release/bruh_mount module/system/bin/bruh_mount
          chmod +x module/system/bin/bruh_mount
          cp module.prop module/
          cp post-fs-data.sh module/
          cp README.md module/
          cp -r webroot module/
          cd module && zip -r ../BruhModule-beta.zip .
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.1.0-beta
          name: BruhModule v0.1.0 Beta
          files: BruhModule-beta.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report Failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            gh issue create --title "Build Failed on CI" --body "$(echo -e '```\n'; tail -n 1000 build.log; echo -e '\n```')"
          else
            gh issue create --title "Build Failed on CI (No log)" --body "Action failed before log creation"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
